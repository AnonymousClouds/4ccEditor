;   1  REGULAR. Counts towards the player's AATF_<TYPE>_SKILLS allowance.
;      Extra 'A' positions and extra COM styles eat into that allowance.
;   2  FREE. Does not count towards any allowance. The editor shows the
;      card's name with a trailing '*'.
;
; A card with no AATF_SKILL_CARD_xx line at all is treated as BANNED, so
; deleting a line bans the card. Cards numbered above the highest index
; valid for PES_VERSION are ignored entirely.
;
; Captaincy is 1 because AATF_CAPTAIN_FREE_CARD above makes it free for the
; captain.
;
AATF_SKILL_CARD_00=2   ; Scissors Feint
