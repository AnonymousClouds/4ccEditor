;==========================================================================
; 4ccEditor - AATF Ruleset (EXAMPLE)
;==========================================================================
; This file is the complete AATF ruleset. Every rule AATF enforces lives
; here; nothing about the rules is compiled into the editor.
;
; To use it:
;   1. Copy this file next to 4ccEditor.exe (the folder the .exe is in).
;   2. Open 4ccEditor -> File -> Settings... -> "AATF Ruleset".
;   3. Pick this file from the dropdown and close the window.
;
; SYNTAX
;   KEY=VALUE      one setting per line; '=' separates the key from the value
;   ; or #         ';' and '#' start a comment that runs to end of line
;   Keys are case-insensitive. Leading and trailing spaces are ignored.
;   Values may be left empty (an empty AATF_BRACKET_n_TRIGGER means
;   "this bracket is never triggered").
;   Unknown keys are reported in a warning and then ignored.
;   Heights are in centimetres. Values written as "a : b : c" are a
;   multi-part entry and use ':' as the separator.
;==========================================================================
;--------------------------------------------------------------------------
; League Type (4CC or VGL)
;--------------------------------------------------------------------------
LEAGUE_TYPE=4CC

;--------------------------------------------------------------------------
; GAME VERSION
;--------------------------------------------------------------------------
; The PES version this ruleset was written for. The number of cards differs
; from one version to the next (28 on 15 to 18, 39 on 19, 41 on 20 and
; newer), so AATF uses this to know which AATF_SKILL_CARD_xx entries exist.
; AATF still reads version-gated abilities (Clearing / Reflexes / Coverage
; need 16+, Physical Contact needs 17+, Tight Possession / Aggression need
; 20+) from the EDIT file you actually loaded. If the loaded EDIT file is
; a different version than this value, AATF warns but still runs.
PES_VERSION=

;--------------------------------------------------------------------------
; SQUAD
;--------------------------------------------------------------------------
; Composition rules for the squad as a whole.
AATF_SQUAD_SIZE=23
; Minimum number of registered goalkeepers.
AATF_MIN_GK=1
; 1 = the squad must have a designated captain.
AATF_REQUIRE_CAPTAIN=1
; Playable positions set to 'B' are illegal when this is 0.
AATF_ALLOW_B_POSITION=0
; When 0, an outfield player may not have GK as a second 'A' position.
AATF_GK_AS_SECOND_A=0
; When 0, a bronze/silver/gold medal player may not be a goalkeeper.
AATF_MEDALS_CAN_BE_GK=0
; Competition rule: 1 = every player must be in their registered position in
; the team's first preset. 0 = only the registered position itself is checked.
AATF_CHECK_FIRST_PRESET=1
; The registered position and Playing Style ranges normally follow PES_VERSION;
; uncomment these to pin them down exactly for a special ruleset.
;AATF_MIN_REG_POS=0
;AATF_MAX_REG_POS=12
;AATF_MIN_PLAY_STYLE=0
;AATF_MAX_PLAY_STYLE=21
; Enforce the in-game limit of 10 non-COM skill cards. 0 or absent = no limit.
;AATF_MAX_SKILL_CARDS=0


;--------------------------------------------------------------------------
; HEIGHT SYSTEM
;--------------------------------------------------------------------------
; AATF_HEIGHT_BRACKETS decides which height rule is used:
;
;    0   HEIGHT CHECKS ARE SKIPPED.
;
;   -1   POOLED MODE. There are no per-class head counts at all. Instead
;        the squad draws from a shared total height pool; see the
;        HEIGHT POOL section below. Use this for "total height" style
;        competition rules.
;
;    1   One bracket: AATF_BRACKET_1 is used for every squad.
;    2   Two brackets, manually add more brackets if you set this higher.
;
; Only the first AATF_HEIGHT_BRACKETS brackets are ever used; any higher
; ones are ignored. AATF tests them in order - bracket 1 first, then 2, then
; 3, then 4 - and uses the first one whose AATF_BRACKET_n_TRIGGER is
; satisfied. If no trigger is satisfied, the last valid bracket is
; used as the fallback, so leave your intended fallback bracket's trigger empty.
AATF_HEIGHT_BRACKETS=0

; The height class that receives "manlet" treatment. Players in this class
; get the bonus card / COM style / position / weak-foot bonuses described on
; that class's own lines, and - when the active bracket allows it - the stat
; bonus given by their player class's AATF_<TYPE>_MANLET_BUFF.
; Matched case-insensitively against the class names used in the brackets.
AATF_MANLET_CLASS=MANLET

; A player at or above this height is "height abuse" (HA). HA players are
; rejected unless their player class sets AATF_<TYPE>_HA_ALLOWED=1, and are
; then penalized by the AATF_HA_NERF_<CLASS> keys further down.
AATF_HA_HEIGHT=194

; Classes listed here are matched with "height <= this value" instead of
; "height == this value". This is what lets a 170cm player count as a
; manlet under a 175cm MANLET entry rather than being an illegal height.
; Comma-separated, or empty to require exact heights everywhere.
AATF_HEIGHT_MAX_ONLY_CLASSES=MANLET,MID

;--------------------------------------------------------------------------
; HEIGHT POOL  (only used when AATF_HEIGHT_BRACKETS = -1)
;--------------------------------------------------------------------------
; The squad's total height must not exceed the pool. Every player counts at
; their actual height, goalkeepers included.
;
; Pooled mode has no height classes at all: the AATF_BRACKET_n blocks are
; ignored and no class dictionary is needed. Every height in the range below
; is legal.
AATF_HEIGHT_POOL_TOTAL=0

; The shortest and the tallest height a player may have. A height outside
; this range is illegal, and a height inside it is legal. 0 leaves that end
; of the range open, so with both at 0 every height is legal. Every legal
; height counts at its own value towards the pool total.
AATF_HEIGHT_POOL_MIN_HEIGHT=0
AATF_HEIGHT_POOL_MAX_HEIGHT=0

; A goalkeeper normally obeys the range above like everyone else. Set
; AATF_HEIGHT_POOL_GK_STRICT to 1 to pin every goalkeeper to the single
; height in AATF_HEIGHT_POOL_GK_HEIGHT instead, which makes a goalkeeper at
; any other height illegal. At 0 the key below is not read at all, so
; leaving it at 0 is correct.
AATF_HEIGHT_POOL_GK_STRICT=0
AATF_HEIGHT_POOL_GK_HEIGHT=0

;==========================================================================
; HEIGHT BRACKETS
;==========================================================================
; One block per bracket. Every block uses the same keys:
;
;   AATF_BRACKET_<n>_NAME          Free text. Printed in the AATF report so
;                                  you can see which bracket was picked.
;   AATF_BRACKET_<n>_MANLET_BUFF   1 = players in AATF_MANLET_CLASS get their
;                                  player class's AATF_<TYPE>_MANLET_BUFF
;                                  stat bonus in this bracket. 0 = no stat
;                                  bonus (the card / COM / position /
;                                  weak-foot bonuses on the class still
;                                  apply, they are listed separately).
;   AATF_BRACKET_<n>_TRIGGER       In centimetres. This bracket is chosen
;                                  when at least one squad player is this
;                                  tall or taller. Brackets are tested in
;                                  order and the first satisfied trigger
;                                  wins, so a later bracket can never
;                                  override an earlier one. Leave the value
;                                  empty for a bracket that is only ever
;                                  the fallback.
;
; THE DICTIONARY - one line per height class:
;
;   AATF_BRACKET_<n>_<CLASS> = <height> : <gkHeight> : <numPlayers>
;
;   <CLASS>       the class name, spelled however you like - it is stored
;                 uppercase. Error messages print it, and the
;                 AATF_HEIGHT_MAX_ONLY_CLASSES key refers to it.
;   <height>      exact centimetres required of an outfield player, or the
;                 upper bound if <CLASS> is in AATF_HEIGHT_MAX_ONLY_CLASSES.
;   <gkHeight>    exact centimetres required of a goalkeeper, or 0 if the
;                 class has no goalkeeper variant. A goalkeeper matches a
;                 class by <gkHeight>, an outfield player by <height>.
;   <numPlayers>  EXACT number of squad players this class must account
;                 for. Not a maximum and not a minimum: a squad with too
;                 many and a squad with too few are both errors. The
;                 bracket's counts should add up to AATF_SQUAD_SIZE.
;
; OPTIONAL BONUSES on a class (omit them, or set them to 0, for no bonus):
;   AATF_BRACKET_<n>_<CLASS>_CARD_BONUS    extra counting cards allowed
;   AATF_BRACKET_<n>_<CLASS>_COM_BONUS     extra free COM Playing Styles
;   AATF_BRACKET_<n>_<CLASS>_A_POS_BONUS   extra free 'A' positions
;   AATF_BRACKET_<n>_<CLASS>_WEAK_USE      Weak Foot Usage override
;   AATF_BRACKET_<n>_<CLASS>_WEAK_ACC      Weak Foot Accuracy override
;
;--------------------------------------------------------------------------
; BRACKET 1
;--------------------------------------------------------------------------
AATF_BRACKET_1_NAME=CHANGEME
; 1 = players in AATF_MANLET_CLASS get their AATF_<TYPE>_MANLET_BUFF bonus.
AATF_BRACKET_1_MANLET_BUFF=0
; Height at which this bracket takes over, or empty to leave it as the
; fallback bracket.
AATF_BRACKET_1_TRIGGER=

AATF_BRACKET_1_GIGA   = 210 :   0 : 0
AATF_BRACKET_1_GIANT  = 194 :   0 : 6
AATF_BRACKET_1_TALL   = 185 : 189 : 5
AATF_BRACKET_1_MID    = 180 :   0 : 6
AATF_BRACKET_1_MANLET = 175 :   0 : 6
AATF_BRACKET_1_MANLET_CARD_BONUS=1
AATF_BRACKET_1_MANLET_COM_BONUS=1
AATF_BRACKET_1_MANLET_A_POS_BONUS=1
AATF_BRACKET_1_MANLET_WEAK_USE=4
AATF_BRACKET_1_MANLET_WEAK_ACC=4

;--------------------------------------------------------------------------
; BRACKET 2
;--------------------------------------------------------------------------
AATF_BRACKET_2_NAME=CHANGEME2
; 1 = players in AATF_MANLET_CLASS get their AATF_<TYPE>_MANLET_BUFF bonus.
AATF_BRACKET_2_MANLET_BUFF=0
; Height at which this bracket takes over, or empty to leave it as the
; fallback bracket.
AATF_BRACKET_2_TRIGGER=

AATF_BRACKET_2_GIGA   = 210 :   0 : 0
AATF_BRACKET_2_GIANT  = 194 :   0 : 0
AATF_BRACKET_2_TALL   = 185 : 189 : 23
AATF_BRACKET_2_MID    = 180 :   0 : 0
AATF_BRACKET_2_MANLET = 175 :   0 : 0
AATF_BRACKET_2_MANLET_CARD_BONUS=0
AATF_BRACKET_2_MANLET_COM_BONUS=0
AATF_BRACKET_2_MANLET_A_POS_BONUS=0
AATF_BRACKET_2_MANLET_WEAK_USE=2
AATF_BRACKET_2_MANLET_WEAK_ACC=2

;==========================================================================
; PLAYER CLASSES
;==========================================================================
; There are five classes. REGULAR, BRONZE, SILVER and GOLD are outfield
; medals. A goalkeeper is counted as a REGULAR for head-count purposes and
; is tracked separately only so that its allowances can differ.
;
; For each class <TYPE> is one of REGULAR, BRONZE, SILVER, GOLD, GOALKEEPER:
;
;   _COUNT               EXACT number of this class on the squad.
;                        GOALKEEPER is the exception: its count is
;                        informational only, and its players are counted as
;                        part of _REGULAR_COUNT. REGULAR + BRONZE + SILVER +
;                        GOLD must add up to AATF_SQUAD_SIZE.
;   _FORM                EXACT required Form / Condition.
;   _INJURY_RESISTANCE   maximum allowed Injury Resistance.
;   _WEAK_FOOT_USAGE     maximum allowed Weak Foot Usage.
;   _WEAK_FOOT_ACCURACY  maximum allowed Weak Foot Accuracy.
;   _SKILLS              maximum counting (class 1) cards.
;   _TRICKS              maximum free (class 2) cards. Any free card beyond
;                        this many starts counting as a class 1 card. This
;                        is why goalkeepers are set to 0.
;   _COMS                number of COM Playing Styles that are free; each
;                        style beyond that number costs a card instead.
;   _A_POS               number of 'A' positions that are free. This
;                        already includes the 'A' the registered position
;                        grants. Each 'A' over the allowance costs a card.
;   _BASE_STAT           the value every ability must equal...
;   _MANLET_BUFF         ...plus this, for players in AATF_MANLET_CLASS in a
;                        bracket with AATF_BRACKET_n_MANLET_BUFF=1.
;   _HA_ALLOWED          1 = this class may field a player at or above
;                        AATF_HA_HEIGHT. 0 = it may not. What such a player
;                        costs in rating is set by the HA NERF section
;                        below, not here.
;
; Which medal a player is judged against is derived from their rating, low
; to high: below (BRONZE base - AATF_HA_NERF_BRONZE) is REGULAR, then
; BRONZE, then SILVER, then GOLD. Anything else is an illegal ability score.
;
; Every ability can be given a bonus or a malus on top of _BASE_STAT; see
; the ABILITY BONUS / MALUS section further down. The manlet bonus and the
; HA nerf are added on top of _BASE_STAT as well, and all three stack.

;--------------------------------------------------------------------------
; GOLD
;--------------------------------------------------------------------------
AATF_GOLD_COUNT=2
AATF_GOLD_FORM=8
AATF_GOLD_INJURY_RESISTANCE=3
AATF_GOLD_WEAK_FOOT_USAGE=4
AATF_GOLD_WEAK_FOOT_ACCURACY=4
AATF_GOLD_SKILLS=7
AATF_GOLD_TRICKS=9
AATF_GOLD_COMS=2
AATF_GOLD_A_POS=2
AATF_GOLD_BASE_STAT=99
AATF_GOLD_MANLET_BUFF=0
AATF_GOLD_HA_ALLOWED=1

;--------------------------------------------------------------------------
; SILVER
;--------------------------------------------------------------------------
AATF_SILVER_COUNT=2
AATF_SILVER_FORM=8
AATF_SILVER_INJURY_RESISTANCE=2
AATF_SILVER_WEAK_FOOT_USAGE=4
AATF_SILVER_WEAK_FOOT_ACCURACY=4
AATF_SILVER_SKILLS=6
AATF_SILVER_TRICKS=9
AATF_SILVER_COMS=2
AATF_SILVER_A_POS=2
AATF_SILVER_BASE_STAT=88
AATF_SILVER_MANLET_BUFF=0
AATF_SILVER_HA_ALLOWED=1

;--------------------------------------------------------------------------
; BRONZE
;--------------------------------------------------------------------------
AATF_BRONZE_COUNT=0
AATF_BRONZE_FORM=8
AATF_BRONZE_INJURY_RESISTANCE=1
AATF_BRONZE_WEAK_FOOT_USAGE=4
AATF_BRONZE_WEAK_FOOT_ACCURACY=4
AATF_BRONZE_SKILLS=5
AATF_BRONZE_TRICKS=9
AATF_BRONZE_COMS=1
AATF_BRONZE_A_POS=2
AATF_BRONZE_BASE_STAT=88
AATF_BRONZE_MANLET_BUFF=0
AATF_BRONZE_HA_ALLOWED=1

;--------------------------------------------------------------------------
; REGULAR  (18 of these are the squad, goalkeepers included)
;--------------------------------------------------------------------------
AATF_REGULAR_COUNT=18
AATF_REGULAR_FORM=4
AATF_REGULAR_INJURY_RESISTANCE=1
AATF_REGULAR_WEAK_FOOT_USAGE=2
AATF_REGULAR_WEAK_FOOT_ACCURACY=2
AATF_REGULAR_SKILLS=4
AATF_REGULAR_TRICKS=9
AATF_REGULAR_COMS=0
AATF_REGULAR_A_POS=2
AATF_REGULAR_BASE_STAT=77
AATF_REGULAR_MANLET_BUFF=5
AATF_REGULAR_HA_ALLOWED=1

;--------------------------------------------------------------------------
; GOALKEEPER
;--------------------------------------------------------------------------

AATF_GOALKEEPER_FORM=4
AATF_GOALKEEPER_INJURY_RESISTANCE=1
AATF_GOALKEEPER_WEAK_FOOT_USAGE=2
AATF_GOALKEEPER_WEAK_FOOT_ACCURACY=2
AATF_GOALKEEPER_SKILLS=3
AATF_GOALKEEPER_TRICKS=0
AATF_GOALKEEPER_COMS=0
AATF_GOALKEEPER_A_POS=1
AATF_GOALKEEPER_BASE_STAT=77
AATF_GOALKEEPER_MANLET_BUFF=5
AATF_GOALKEEPER_HA_ALLOWED=1

;--------------------------------------------------------------------------
; HEIGHT-ABUSE NERF
;--------------------------------------------------------------------------
; How much rating a player at or above AATF_HA_HEIGHT gives up. Subtracted
; from the required value of every one of their abilities. 0 = no nerf.
;
; This is deliberately kept out of the class blocks above: the class keys
; decide only WHETHER such a player is allowed, and these decide what he
; costs. One key per class, named after the class the player is judged
; against - so AATF_HA_NERF_GK applies to a goalkeeper, not to a medal.
AATF_HA_NERF_REGULAR=0
AATF_HA_NERF_BRONZE=0
AATF_HA_NERF_SILVER=0
AATF_HA_NERF_GOLD=0
AATF_HA_NERF_GK=0

;==========================================================================
; ABILITY BONUS / MALUS
;==========================================================================
; Every ability in the game is listed below with a bonus or a malus, applied
; on top of that player class's AATF_<TYPE>_BASE_STAT. 0 means no change.
; A positive number is a bonus, a negative number is a malus. A leading '+'
; is optional: 5 and +5 mean the same thing.
;
; The bonus is global: it is one number per ability, applied in full to
; every player in a class that the next section switches on.
;

AATF_BONUS_OFFENSIVE_AWARENESS=0
AATF_BONUS_BALL_CONTROL=0
AATF_BONUS_DRIBBLING=0
AATF_BONUS_LOW_PASS=0
AATF_BONUS_LOFTED_PASS=0
AATF_BONUS_FINISHING=0
AATF_BONUS_PLACE_KICKING=0
AATF_BONUS_CURL=0
AATF_BONUS_HEADER=0
AATF_BONUS_DEFENSIVE_AWARENESS=0
AATF_BONUS_BALL_WINNING=0
AATF_BONUS_KICKING_POWER=0
AATF_BONUS_SPEED=0
AATF_BONUS_ACCELERATION=0
AATF_BONUS_BALANCE=0
AATF_BONUS_PHYSICAL_CONTACT=0
AATF_BONUS_JUMP=0
AATF_BONUS_STAMINA=0
AATF_BONUS_GK_AWARENESS=0
AATF_BONUS_CATCHING=0
AATF_BONUS_CLEARING=0
AATF_BONUS_REFLEXES=0
AATF_BONUS_GK_REACH=0
AATF_BONUS_TIGHT_POSSESSION=0
AATF_BONUS_AGGRESSION=0

;--------------------------------------------------------------------------
; WHICH CLASSES A BONUS REACHES
;--------------------------------------------------------------------------
; Whether the bonuses above apply to a class.
AATF_BONUS_AFFECT_GOLD=0
AATF_BONUS_AFFECT_SILVER=0
AATF_BONUS_AFFECT_BRONZE=0
AATF_BONUS_AFFECT_REGULAR=0
AATF_BONUS_AFFECT_GK=0

;==========================================================================
; UNIQUE GOALKEEPER STATS
;==========================================================================
; By default a goalkeeper's abilities are worked out exactly like an
; outfield player's: AATF_GOALKEEPER_BASE_STAT, plus the bonuses above if
; AATF_BONUS_AFFECT_GK is 1, plus or minus the manlet and HA terms exactly
; as they do for an outfield player.
;
; Set AATF_UNIQUE_GK_STATS to 1 to give goalkeepers their own ability table
; instead. The AATF_GK_* keys below then become absolute required values and
; the AATF_BONUS_* table is not applied to goalkeepers at all. An ability
; left at 0 still falls back to AATF_GOALKEEPER_BASE_STAT.
;
; This switch only changes abilities. Everything else about goalkeepers -
; count, form, cards, height and so on - still comes from the
; AATF_GOALKEEPER_* keys in the PLAYER CLASSES section above.
;
; AATF_GK_TIGHT_POSSESSION and AATF_GK_AGGRESSION are ignored on PES 19 and
; older, because those abilities do not exist in those EDIT files.
AATF_UNIQUE_GK_STATS=0

; Leave all of these at 0 to use AATF_GOALKEEPER_BASE_STAT.
AATF_GK_OFFENSIVE_AWARENESS=0
AATF_GK_BALL_CONTROL=0
AATF_GK_DRIBBLING=0
AATF_GK_LOW_PASS=0
AATF_GK_LOFTED_PASS=0
AATF_GK_FINISHING=0
AATF_GK_PLACE_KICKING=0
AATF_GK_CURL=0
AATF_GK_HEADER=0
AATF_GK_DEFENSIVE_AWARENESS=0
AATF_GK_BALL_WINNING=0
AATF_GK_KICKING_POWER=0
AATF_GK_SPEED=0
AATF_GK_ACCELERATION=0
AATF_GK_BALANCE=0
AATF_GK_PHYSICAL_CONTACT=0
AATF_GK_JUMP=0
AATF_GK_STAMINA=0
AATF_GK_GK_AWARENESS=0
AATF_GK_CATCHING=0
AATF_GK_CLEARING=0
AATF_GK_REFLEXES=0
AATF_GK_GK_REACH=0
AATF_GK_TIGHT_POSSESSION=0
AATF_GK_AGGRESSION=0

;==========================================================================
; CAPTAINCY
;==========================================================================
; Card index that is free only for the squad's designated captain. Every
; other player who holds this card spends a normal card on it.
AATF_CAPTAIN_FREE_CARD=25
; Extra allowances the captain gets on top of those of their player class.
AATF_CAPTAIN_EXTRA_A_POS=0
AATF_CAPTAIN_EXTRA_COM=0

;==========================================================================
